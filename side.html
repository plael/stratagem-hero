#ar { display: flex; gap: calc(var(--u) * 1px); margin-top: calc(var(--u) * 1px); min-height: calc(var(--u) * 11px); }
#ar img { width: calc(var(--u) * 11px); height: calc(var(--u) * 11px); image-rendering: pixelated; }
#nx { display: flex; gap: calc(var(--u) * 2px); margin-top: calc(var(--u) * 1px); opacity: .55; min-height: calc(var(--u) * 10px); }
#ov { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: radial-gradient(ellipse at center, #05060bcc, #05060b66 70%); gap: calc(var(--u) * 4px); cursor: pointer; }
#ov.show { display: flex; }
#ov .ttl { font: 900 calc(var(--u) * 16px) / .95 "Consolas", "D2Coding", monospace; color: var(--se); letter-spacing: .06em; text-shadow: calc(var(--u) * 1px) calc(var(--u) * 1px) 0 #8a1e12, 0 0 calc(var(--u) * 6px) #ffe71055; }
#ov .ttl span { color: #fff; text-shadow: calc(var(--u) * 1px) calc(var(--u) * 1px) 0 #3a3738; }
#ov .ttl.small { font-size: calc(var(--u) * 11px); }
#ov .ttl.red { color: #ff5a4a; }
#ov p { font-size: calc(var(--u) * 5px); line-height: 1.45; text-shadow: 0 1px 0 #000; }
#ov p b { color: var(--se); }
#ov .big { font: 900 calc(var(--u) * 11px) / 1 "Consolas", monospace; color: #fff; }
#ov .keys { font: 700 calc(var(--u) * 6px) / 1 "Consolas", monospace; color: var(--se); letter-spacing: .3em; }
#ov .go { color: #fff; opacity: .85; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
#ov .rec { display: flex; align-items: center; gap: calc(var(--u) * 3px); background: #0d0f18; border: 1px solid #ffe71055; padding: calc(var(--u) * 2px) calc(var(--u) * 4px); border-radius: calc(var(--u) * 1.5px); }
#ov .rec span { font-size: calc(var(--u) * 4.5px); opacity: .7; }
#ov .rec .code { font: 800 calc(var(--u) * 8px) / 1 "Consolas", monospace; color: var(--se); letter-spacing: .08em; user-select: all; -webkit-user-select: all; }
#ov .rec .cp { font: 700 calc(var(--u) * 4.5px) / 1 inherit; padding: calc(var(--u) * 1.5px) calc(var(--u) * 3px); border: 0; border-radius: calc(var(--u) * 1px); background: #ffe710; color: #111; cursor: pointer; }
#ov .hint { font-size: calc(var(--u) * 4.2px); opacity: .8; }
#nf { display: none; position: absolute; right: calc(var(--u) * 4px); bottom: calc(var(--u) * 4px); font-size: calc(var(--u) * 4.5px); background: #000a; padding: calc(var(--u) * 1.5px) calc(var(--u) * 3px); border-radius: calc(var(--u) * 1px); pointer-events: none; }
body.nofocus:not(.touch) #nf { display: block; }
#pad { display: none; flex: none; width: min(100vw, 420px); padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px); grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; height: min(32vh, 200px); }
body.touch #pad { display: grid; }
#pad button { border: 0; border-radius: 12px; background: #1d2130; box-shadow: inset 0 -4px 0 #0c0e16; display: flex; align-items: center; justify-content: center; }
#pad button:active { background: #2d3348; transform: translateY(2px); box-shadow: inset 0 -2px 0 #0c0e16; }
#pad button img { width: 52%; max-width: 64px; image-rendering: pixelated; pointer-events: none; }
#pad .u { grid-column: 2; grid-row: 1; } #pad .l { grid-column: 1; grid-row: 2; } #pad .d { grid-column: 2; grid-row: 2; } #pad .r { grid-column: 3; grid-row: 2; }

function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function circ(x, y, r, c, sy = 1) {
  r = Math.round(r); if (r <= 0) return;
  ctx.fillStyle = c; x = Math.round(x); y = Math.round(y);
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.round(Math.sqrt(r * r - dy * dy));
    ctx.fillRect(x - w, y + Math.round(dy * sy), w * 2 + 1, 1);
  }
}
function line(x0, y0, x1, y1, c, w = 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  ctx.fillStyle = c;
  for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; ctx.fillRect(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), w, w); }
}
function sprite(rows, x, y, map, flip = false) {
  for (let j = 0; j < rows.length; j++) {
    const row = rows[j];
    for (let i = 0; i < row.length; i++) {
      const ch = flip ? row[row.length - 1 - i] : row[i];
      const c = map[ch]; if (!c) continue;
      ctx.fillStyle = c; ctx.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
    }
  }
}

const CAT_CROWD = new Set(['w-mg', 'w-stalwart', 'w-hmg', 'w-maxigun', 'w-bullet', 'w-gl', 'w-beltgl', 'w-flamer', 'w-cremator', 'w-sterilizer', 'w-arc', 'w-airburst', 'w-wasp', 'w-napalm', 'w-deesc', 'w-nova', 'w-defol', 'o-gatling', 'o-airburst', 'o-120', 'o-walking', 'o-napalm', 'o-gas', 'o-ems', 'e-strafe', 'e-air', 'e-cluster', 'e-napalm', 'e-gas', 's-mg', 's-gatling', 's-mortar', 's-ems', 's-flame', 's-hmg', 's-tesla', 's-grenadier', 's-laser', 's-gasmortar', 'm-ap', 'm-fire', 'm-gas', 'b-dog', 'b-breath', 'b-k9', 'b-hotdog', 'b-rover', 'v-frv', 'v-incfrv']);
const CAT_DEMO = new Set(['o-precision', 'o-380', 'o-120', 'o-walking', 'o-laser', 'o-rail', 'e-500', 'e-air', 'e-rocket', 'w-eat', 'w-rr', 'w-quasar', 'w-leveller', 'w-silo', 'w-spear', 'w-epoch', 'w-commando', 'w-hammer', 'b-hellbomb', 'b-c4', 'v-bastion']);

function makeEnemy(s, force) {
  const R = FACTIONS[G.faction].roster, k = force ? (force.kind === 'struct' ? 'b-c4' : force.kind === 'heavy' ? 'e-500x' : force.kind === 'pack' ? 'w-mg' : 'b-jump') : s.k;
  const e = { fac: G.faction, t: 0, T: approachTime(s), p: 0, frozen: false, dead: false, bob: Math.random() * 6, kx: 0, step: 0 };
  const onlyDemo = CAT_DEMO.has(k) && !CAT_AT.has(k) && !CAT_CROWD.has(k);
  if (force ? force.kind === 'struct' : CAT_DEMO.has(k) && Math.random() < (onlyDemo ? 0.7 : 0.3)) {
    e.def = EN[R.struct]; e.struct = true;
    e.sx = Math.round(rand(138, W - e.def.w - 8));
    const wd = EN[e.def.spawn];
    e.walker = { def: wd, x0: e.sx + e.def.door[0], alive: true, bob: Math.random() * 6 };
    e.door = 0.6;
  } else if (force ? force.kind === 'heavy' : CAT_AT.has(k)) {
    const pool = R.heavy.filter(n => (EN[n].min || 1) <= G.round);
    e.def = EN[force && force.name ? force.name : pick(pool)]; e.heavy = true;
  } else if (force ? force.kind === 'pack' : CAT_CROWD.has(k)) {
    e.def = EN[R.small];
    const n = 3 + (G.round >= 3 ? 1 : 0) + (G.round >= 5 ? 1 : 0);
    e.members = []; let dx = 0;
    for (let i = 0; i < n; i++) { e.members.push({ dx, bob: Math.random() * 6, alive: true }); dx += e.def.w + Math.round(rand(2, 9)); }
    e.span = dx;
  } else e.def = EN[R.std];
  // 대형·무리는 화면 밖에서 빠르게 걸어 들어와 화면 안에서 출발 (빨리 잡아도 화면 안에서 터지게)
  e.xs = e.heavy || e.members ? W + 4 : W + 14;
  e.x0 = e.heavy ? W - Math.round(e.def.w * 0.6) - 4 : e.members ? W - 34 : W + 14;
  e.cx = CONTACT + (e.def.range || 0);
  if (e.heavy) heavyVoice(e.def.voice);
  return e;
}
function heavyVoice(v) {
  if (v === 'bug' || v === 'titan') { osc({ f: v === 'titan' ? 55 : 80, f2: 38, d: 0.9, v: 0.22, type: 'sawtooth', am: [23, 0.5], a: 0.08, dist: true }); nz({ type: 'bandpass', f: 600, q: 2, d: 0.7, v: 0.12, am: [17, 0.6], a: 0.05 }); }
  else if (v === 'bot' || v === 'factory') { osc({ f: v === 'factory' ? 82 : 110, d: 0.7, v: 0.09, type: 'square', a: 0.04 }); osc({ f: v === 'factory' ? 87 : 116, d: 0.7, v: 0.07, type: 'square', a: 0.04 }); }
  else if (v === 'vox') { for (let i = 0; i < 7; i++) osc({ f: pick([180, 220, 160, 260, 140]), d: 0.09, v: 0.07, type: 'square', at: i * 0.1, am: [60, 0.6] }); }
  else if (v === 'ray') { nz({ type: 'bandpass', f: 400, f2: 2200, q: 1.5, d: 0.8, v: 0.18, a: 0.3 }); osc({ f: 660, f2: 990, d: 0.8, v: 0.03, type: 'sine', a: 0.2 }); }
  else if (v === 'ill' || v === 'flesh') { [330, 415, 494].forEach((f, i) => osc({ f: v === 'flesh' ? f / 2 : f, d: 0.9, v: 0.04, type: 'sine', a: 0.2, am: [6 + i, 0.5] })); }
}
function easeMove(e, p) {
  const m = e.def.move;
  if (m === 'charge') {
    const K = [[0, 0], [0.35, 0.15], [0.5, 0.52], [0.74, 0.6], [0.9, 0.97], [1, 1]];
    for (let i = 1; i < K.length; i++) if (p <= K[i][0]) { const [a, b] = K[i - 1], [c, d] = K[i]; return b + (d - b) * (p - a) / (c - a); }
    return 1;
  }
  if (m === 'stomp' || m === 'lurch') { const n = m === 'lurch' ? 9 : e.def.steps || 5, a = m === 'lurch' ? 0.6 : 0.85; return p - Math.sin(p * Math.PI * 2 * n) / (Math.PI * 2 * n) * a; }
  return p;
}
function enemyX(e) {
  if (e.struct) return e.sx;
  const walk = (e.x0 - e.cx) * easeMove(e, e.p);
  if (e.xs === e.x0) return e.x0 - walk;
  const k = clamp(e.t / 0.4, 0, 1), ent = 1 - (1 - k) * (1 - k);
  return e.xs + (e.x0 - e.xs) * ent - walk;
}
function eW(e) { return e.members ? e.span : e.def.w; }
function ecx(e) { return Math.min(W - 8, enemyX(e) + (e.kx || 0) + eW(e) / 2); }
function eAlt(e) { return e.def.move === 'fly' ? (e.alt || 30) : 0; }
function aimY(e) { return GROUND - eAlt(e) - e.def.aim; }
function aimX(e) {
  if (e.members) { const m = e.members.find(m => m.alive); if (m) return Math.min(W - 6, enemyX(e) + (e.kx || 0) + m.dx + e.def.w / 2); }
  return ecx(e);
}
function walkerX(e) { const w = e.walker; return w.x0 - (w.x0 - CONTACT) * e.p; }

// 다가오는 적 움직임 (발소리·돌진·비행·건물에서 나오는 잡몹)
function updateEnemy(e, dt) {
  e.t += dt; e.p = clamp(e.t / e.T, 0, 1);
  const D = e.def;
  if (D.move === 'stomp' || D.move === 'lurch') {
    const n = D.move === 'lurch' ? 9 : D.steps || 5, st = Math.floor(e.p * n);
    if (st !== e.step) {
      e.step = st;
      if (D.move === 'stomp') { osc({ f: 70, f2: 32, d: 0.25, v: Math.min(0.6, 0.15 + D.stepShake * 2.5), dist: true }); nz({ type: 'lowpass', f: 500, d: 0.2, v: 0.15 }); addShake(D.stepShake); dust(enemyX(e) + D.w * 0.3, 5, 6); }
      else nz({ type: 'bandpass', f: 400, q: 2, d: 0.12, v: 0.1 });
    }
  }
  if (D.move === 'charge') {
    const rush = (e.p > 0.35 && e.p < 0.5) || (e.p > 0.74 && e.p < 0.9);
    if (rush && !e.rush) { nz({ type: 'lowpass', f: 300, d: 0.7, v: 0.35, am: [14, 0.5], a: 0.03 }); osc({ f: 60, f2: 40, d: 0.6, v: 0.25, type: 'sawtooth', am: [14, 0.6], dist: true }); addShake(0.12); }
    e.rush = rush;
    if (rush && Math.random() < 0.7) P({ x: enemyX(e) + D.w - 4, y: GROUND - 2, vx: rand(10, 50), vy: -rand(5, 20), drag: 1, kind: 'smoke', max: 0.7, r: rand(2, 4) });
  }
  if (D.move === 'roll' && Math.random() < 0.25) { S.click(300 + Math.random() * 300, 0.03); if (Math.random() < 0.3) P({ x: enemyX(e) + rand(10, 60), y: GROUND - 2, vx: rand(10, 30), vy: -rand(3, 10), drag: 1, kind: 'smoke', max: 0.6, r: rand(1.5, 3) }); }
  if (D.move === 'fly') {
    const dive = clamp((e.p - 0.55) / 0.3, 0, 1);
    e.alt = Math.round(34 - 22 * dive * dive + Math.sin(e.t * 3) * 2);
    if (e.p > 0.55 && !e.dived) { e.dived = true; heavyVoice('ray'); }
  }
  if (e.struct) {
    if (e.door > 0) e.door -= dt;
    if (D.spawn === 'trooper' && Math.random() < 0.15) P({ x: e.sx + 28 + rand(-1, 1), y: GROUND - 38, vx: rand(-4, 4), vy: -rand(8, 16), drag: 0.4, kind: 'smoke', max: 1.6, r: rand(2, 3.5) });
  }
  if (D.atk === 'cannon' && e.p > 0.8) e.charge = true;
  if (D.atk === 'laser' && e.p > 0.85) e.charge = true;
  if (D.name === '팩토리 스트라이더') e.bay = e.p > 0.6;
}

function drawEnemy(e, t) {
  if (e.dead) return;
  const D = e.def;
  let P = D.pal.base;
  if (e.flash > 0) P = D.pal.white;
  else if (e.stun > 0 && ((t * 20) | 0) % 2) P = D.pal.stun;
  const blink = e.frozen && !(e.flash > 0) && ((t * 16) | 0) % 2 === 0;
  const kx = Math.round(e.kx || 0) + (e.stun > 0 ? (((t * 40) | 0) % 2) : 0);
  if (e.struct) {
    if (blink) ctx.globalAlpha = 0.75;
    D.draw(e.sx + kx, GROUND, P, t, e);
    ctx.globalAlpha = 1;
    const w = e.walker;
    if (w.alive) { const wd = w.def; wd.draw(walkerX(e), GROUND, wd.pal.base, t, { bob: w.bob, frozen: e.frozen, stop: e.stop }); }
    return;
  }
  if (blink) ctx.globalAlpha = 0.6;
  const x = enemyX(e) + kx;
  if (e.members) {
    for (const m of e.members) if (m.alive) D.draw(x + m.dx, GROUND, P, t, { bob: m.bob, frozen: e.frozen, stop: e.stop });
  } else {
    const gy = GROUND - eAlt(e);
    if (D.move === 'fly' && !e.frozen) { ctx.globalAlpha = 0.35; circ(x + D.w / 2, GROUND + 1, D.w * 0.35, '#000000', 0.15); ctx.globalAlpha = blink ? 0.6 : 1; }
    D.draw(x, gy, P, t, e);
  }
  ctx.globalAlpha = 1;
}

// 맞음: 하얗게 깜빡 + 밀림 + 역경직. 무리는 앞에서부터 한 마리씩 쓰러짐
function goreBurst(x, y, cols, n) { for (let i = 0; i < n; i++) { const a = -Math.PI * Math.random(), v = rand(30, 130); P({ x: x + rand(-3, 3), y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 300, kind: 'debris', max: 0.9 + Math.random() * 0.6, col: pick(cols) }); } }
function hitEnemy(e, lv = 1, kb = 2) {
  if (!e || e.dead) return;
  if (e.members) {
    const alive = e.members.filter(m => m.alive);
    if (alive.length > 1) { const m = alive[0]; m.alive = false; goreBurst(enemyX(e) + (e.kx || 0) + m.dx + e.def.w / 2, GROUND - 4, e.def.gore, 14); }
    e.flash = 0.05; impact(lv); return;
  }
  e.flash = lv >= 2 ? 0.1 : (e.heavy || e.struct ? 0.025 : 0.06);
  if (!e.struct) e.kx = Math.min(30, (e.kx || 0) + kb * (e.heavy ? 0.25 : 1));
  impact(lv);
}
function killTarget(e, how, lv = 2) {
  if (e.dead) return;
  e.dead = true;
  const D = e.def, x = ecx(e);
  if (e.struct) { collapse(e); return; }
  if (e.members) {
    impact(lv);
    for (const m of e.members) if (m.alive) { m.alive = false; const mx = enemyX(e) + (e.kx || 0) + m.dx + D.w / 2; goreBurst(mx, GROUND - 4, D.gore, 14); if (how === 'burn') flames(mx, GROUND - 2, 4, 0.4); }
    return;
  }
  if (e.heavy) {
    impact(3, 0.15);
    goreBurst(x, aimY(e), D.gore, 40 + D.w);
    P({ kind: 'wreck', def: D, x: enemyX(e) + (e.kx || 0), y: GROUND - eAlt(e), vy: 0, g: D.move === 'fly' ? 260 : 0, fly: D.move === 'fly', max: D.move === 'fly' ? 2.2 : 1.6, bot: e.fac === 'bot' || e.fac === 'vote', life: 0 });
    if (how === 'burn') flames(x, GROUND - 2, D.w * 0.3, 0.9);
    return;
  }
  impact(lv);
  goreBurst(x, GROUND - 6, D.gore, 26);
  if (how === 'burn') flames(x, GROUND - 2, 6, 0.5);
  if (how === 'fling' && D.size !== 'heavy') {
    P({ x: x - D.w / 2, y: GROUND, vx: rand(150, 210), vy: -rand(130, 170), g: 420, kind: 'corpse', max: 1.1, def: D, rowsH: D.h });
  }
}
// 건물 붕괴: 흔들리며 가라앉고 연쇄 폭발 + 연기 기둥
function collapse(e) {
  const D = e.def, cx = e.sx + D.w / 2;
  impact(3, 0.2);
  boom(cx, GROUND - D.h * 0.5, 14, { quiet: true });
  for (let i = 0; i < 4; i++) setTimeout(() => boom(e.sx + rand(4, D.w - 4), GROUND - rand(2, D.h * 0.7), rand(6, 10), { quiet: true }), 120 + i * 160);
  P({ kind: 'wreck', def: D, x: e.sx, y: GROUND, vy: 0, g: 0, max: 2.0, bot: true, struct: true, life: 0 });
  cloud(cx, GROUND - D.h * 0.6, 22, ['#5a5656', '#3a3738', '#6a6662']);
  goreBurst(cx, GROUND - D.h * 0.4, ['#56402c', '#7e7874', '#3c2d21', ...D.gore], 40);
  osc({ f: 50, f2: 25, d: 1.6, v: 0.5, dist: true, a: 0.05 }); nz({ type: 'lowpass', f: 900, f2: 120, d: 1.8, v: 0.35, a: 0.05 });
  for (let i = 0; i < 10; i++) S.click(400 + Math.random() * 1600, 0.06, 0.3 + Math.random() * 1.2);
}

// 시간이 다 됐을 때: 각자의 무기로 루이스를 공격
function attackFx(e) {
  const D = e.def, fx = { t: 0 };
  const lx = PX, ly = GROUND - 12;
  const ox = () => enemyX(e) + (D.muz ? D.muz[0] : 0), oy = () => GROUND - eAlt(e) + (D.muz ? D.muz[1] : -8);
  const kind = e.struct ? 'melee' : (D.atk || 'melee');
  let fired = 0;
  if (kind === 'laser') { osc({ f: 180, d: 0.9, v: 0.2, type: 'sawtooth', am: [40, 0.4], dist: true }); nz({ type: 'highpass', f: 3000, d: 0.9, v: 0.15 }); }
  if (kind === 'bile') { nz({ type: 'lowpass', f: 700, d: 0.8, v: 0.4, am: [12, 0.5], a: 0.05 }); osc({ f: 70, f2: 40, d: 0.8, v: 0.25, type: 'sawtooth', dist: true }); }
  if (kind === 'ram') GUN.crunch();
  fx.update = dt => {
    fx.t += dt;
    if (kind === 'cannon' && fired < 2 && fx.t > fired * 0.18) { fired++; GUN.ac(); tracer(ox(), oy(), lx, ly, '#ff3020', 0.1); setTimeout(() => boom(lx + rand(-3, 3), GROUND - 6, 7, { quiet: true }), 100); }
    if (kind === 'gatling' && fx.t < 0.7 && Math.random() < 0.7) { GUN.hmg(); tracer(ox(), oy(), lx + rand(-4, 4), ly + rand(-3, 6), '#ff8c1e', 0.1); sparks(lx, ly, 2, ['#ff3020', '#ffd630']); }
    if (kind === 'strafe' && fx.t < 0.6 && Math.random() < 0.6) { const gx = lx + 40 - fx.t * 90; osc({ f: 900, f2: 300, d: 0.06, v: 0.08, type: 'square' }); P({ x: gx, y: GROUND - 2, vx: 0, vy: -20, kind: 'flash', max: 0.05, r: 2 }); sparks(gx, GROUND - 2, 3, ['#b48cff', '#7fe3ff']); }

let bgCanvas = null;
function makeBg(fac) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const F = FACTIONS[fac], S = F.sky;
  const bands = [0, 18, 36, 54, 70, 82];
  for (let i = 0; i < S.length; i++) { g.fillStyle = S[i]; g.fillRect(0, bands[i], W, GROUND - bands[i]); }
  for (let i = 1; i < S.length; i++) { g.fillStyle = S[i]; for (let x = (i % 2); x < W; x += 2) g.fillRect(x, bands[i] - 1, 1, 1); }
  for (let i = 0; i < 60; i++) { g.fillStyle = Math.random() < 0.3 ? '#c4ccd6' : '#8a94a0'; g.fillRect((Math.random() * W) | 0, (Math.random() * 56) | 0, 1, 1); }
  // planet in the sky
  const px = 40 + Math.random() * 170, py = 26 + Math.random() * 14, pr = 5 + Math.random() * 6;
  const pc = fac === 'bug' ? ['#d8a060', '#a86a38'] : fac === 'bot' ? ['#c84a30', '#7a2418'] : ['#8a7ad8', '#4a3a8a'];
  for (let dy = -pr; dy <= pr; dy++) { const w = Math.sqrt(pr * pr - dy * dy); g.fillStyle = dy < 0 ? pc[0] : pc[1]; g.fillRect(Math.round(px - w), Math.round(py + dy), Math.round(w * 2), 1); }
  let h = 96;
  for (let x = 0; x < W; x++) { h = clamp(h + pick([-1, 0, 0, 1]), 86, 104); g.fillStyle = F.mt[0]; g.fillRect(x, h, 1, GROUND - h); }
  // faction props on the far ridge
  for (let i = 0; i < 5; i++) {
    const x = 70 + Math.random() * 180;
    if (fac === 'bug') {       // 둥지 언덕과 포자 불빛
      const r = 5 + Math.random() * 6, by = 108;
      for (let dy = -r; dy <= 0; dy++) { const w = Math.sqrt(r * r - dy * dy) * 1.4; g.fillStyle = '#3a2416'; g.fillRect(Math.round(x - w), Math.round(by + dy), Math.round(w * 2), 1); }
      g.fillStyle = '#1a0e08'; g.fillRect(Math.round(x - 1), Math.round(by - r * 0.4), 3, 2);
      g.fillStyle = '#ffb020'; g.fillRect(Math.round(x + r * 0.6), Math.round(by - r * 0.7), 1, 1);
    } else if (fac === 'bot') { // 공장 탑과 붉은 신호등
      const w = 5 + ((Math.random() * 5) | 0), hh = 10 + ((Math.random() * 14) | 0);
      g.fillStyle = '#1a1214'; g.fillRect(Math.round(x), 110 - hh, w, hh);
      g.fillStyle = '#2a1c1e'; g.fillRect(Math.round(x) + 1, 110 - hh + 2, w - 2, 1);
      g.fillStyle = '#ff3020'; g.fillRect(Math.round(x + w / 2), 110 - hh - 1, 1, 1);
      g.fillStyle = '#3a2a2c'; g.fillRect(Math.round(x + w / 2), 110 - hh - 4, 1, 3);
    } else {                   // 외계 첨탑
      const hh = 14 + ((Math.random() * 18) | 0);
      for (let j = 0; j < hh; j++) { const w = Math.max(1, Math.round(3 - j / hh * 3)); g.fillStyle = '#1e1a3a'; g.fillRect(Math.round(x - w / 2), 110 - j, w, 1); }
      g.fillStyle = '#b48cff'; g.fillRect(Math.round(x), 110 - hh - 1, 1, 2);
    }
  }
  h = 112;
  for (let x = 0; x < W; x++) { h = clamp(h + pick([-1, 0, 1]), 106, 120); g.fillStyle = F.mt[1]; g.fillRect(x, h, 1, GROUND - h); }
  g.fillStyle = '#281e18'; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = '#56402c'; g.fillRect(0, GROUND, W, 1);
  for (let y = GROUND + 1; y < H; y++) for (let x = 0; x < W; x++) if (Math.random() < 0.06) { g.fillStyle = y < GROUND + 8 ? '#3c2d21' : '#181210'; g.fillRect(x, y, 1, 1); }
  for (let i = 0; i < 10; i++) {
    const x = (Math.random() * W) | 0, y = GROUND + 4 + ((Math.random() * (H - GROUND - 8)) | 0), w = 3 + ((Math.random() * 6) | 0);
    g.fillStyle = '#3c2d21'; g.fillRect(x, y, w, 2); g.fillStyle = '#56402c'; g.fillRect(x + 1, y - 1, w - 2, 1); g.fillStyle = '#181210'; g.fillRect(x, y + 2, w, 1);
  }
  // 슈퍼 지구 깃발 (루이스 뒤)
  g.fillStyle = '#8a94a0'; g.fillRect(12, GROUND - 26, 1, 26);
  g.fillStyle = '#ffe710'; g.fillRect(13, GROUND - 26, 9, 6);
  g.fillStyle = '#1c1e26'; g.fillRect(16, GROUND - 25, 3, 4); g.fillStyle = '#ffe710'; g.fillRect(17, GROUND - 24, 1, 2);
  return c;
}

// 모든 소리는 여기서 합성해요 (파일 없이). 마스터 → 압축기 → 스피커
let AC = null, MASTER = null, DIST = null, NBUF = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.2;
      MASTER = AC.createGain(); MASTER.gain.value = 0.85;
      MASTER.connect(comp); comp.connect(AC.destination);
      DIST = AC.createWaveShaper();
      const curve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 3.2); }
      DIST.curve = curve; DIST.connect(MASTER);
      const n = AC.sampleRate * 2; NBUF = AC.createBuffer(1, n, AC.sampleRate);
      const d = NBUF.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function env(g, t, v, a, d) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
}
function wobble(a, param, t, d, rate, depth) {
  const l = a.createOscillator(), lg = a.createGain();
  l.type = 'square'; l.frequency.value = rate; lg.gain.value = depth;
  l.connect(lg).connect(param); l.start(t); l.stop(t + d + 0.05);
}
// 톤: f→f2, d초, 파형, 크기, at초 뒤, dist=찌그러짐, am=[속도, 깊이] 떨림
function osc(o) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (o.at || 0), d = o.d;
  const s = a.createOscillator(), g = a.createGain();
  s.type = o.type || 'sine';
  s.frequency.setValueAtTime(o.f, t);
  if (o.f2) s.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + (o.fd || d));
  env(g, t, o.v, o.a || 0.003, d);
  if (o.am) wobble(a, g.gain, t, d, o.am[0], o.v * o.am[1]);
  s.connect(g).connect(o.dist ? DIST : MASTER);
  s.start(t); s.stop(t + d + 0.05);
}
// 잡음: 필터 종류·주파수 f→f2, q, d초, 크기
function nz(o) {

/* ---------------- 입자 ---------------- */
const parts = [];
const scorch = [];

/* ---------------- 타격감: 역경직 · 화면 흔들림 · 번쩍임 ---------------- */
let trauma = 0, kickX = 0, kickY = 0, flashA = 0, flashC = '#ffffff', hitstop = 0, lastStop = 0, lastFlash = 0;
function addShake(a, kx = 0, ky = 0) { trauma = Math.min(1, trauma + a); kickX += kx; kickY += ky; }
function stopFor(t, force) {

function flash(a, c = '#ffffff') {

}
// 세기 1 작은 타격 / 2 처치·중간 폭발 / 3 큰 한 방
function impact(level, sh = 0) {

  else if (level >= 2) { stopFor(0.055); addShake(0.25 + sh, 0, 1); flash(0.2, '#fff4d0'); }
  else { stopFor(0.018); addShake(0.035 + sh); }
}
function P(o) { parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0, max: 1, r: 1, kind: 'fire', drag: 0, col: '#fff' }, o)); }

function boom(x, y, s, opt = {}) {
  sfx.boom(s);
  if (!opt.quiet) impact(s >= 16 ? 3 : s >= 9 ? 2 : 1, s * 0.012);
  P({ x, y, kind: 'flash', max: 0.08, r: s * 1.1 });
  const fireN = Math.round(s * 0.9);
  for (let i = 0; i < fireN; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * s * 2.2;
    P({ x: x + Math.cos(a) * s * 0.2, y: y - 2 + Math.sin(a) * s * 0.15, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.6 - s * 1.1, drag: 3, kind: opt.kind || 'fire', max: 0.45 + Math.random() * 0.5, r: s * (0.22 + Math.random() * 0.28) });
  }
  if (!opt.noSmoke) for (let i = 0; i < Math.round(s * 0.6); i++) P({ x: x + rand(-s, s) * 0.6, y: y - rand(0, s * 0.6), vx: rand(-8, 8), vy: -rand(8, 22), drag: 0.6, kind: 'smoke', max: 1.3 + Math.random() * 1.4, r: s * (0.18 + Math.random() * 0.22) });

    P({ x, y: y - 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 320, kind: 'debris', max: 1.2, col: pick(['#ff8c1e', '#ffd630', '#56402c', '#7e7874']) });
  }

}
function cloud(x, y, s, cols) {

}
function sparks(x, y, n, cols) {

}

const FIRE = [[0.08, '#ffffff'], [0.2, '#fff096'], [0.36, '#ffd630'], [0.52, '#ff8c1e'], [0.7, '#e23e1c'], [0.84, '#8a1e12'], [1.01, '#3a3738']];

function updateParts(dt) {

function drawParts(pass) {

  const left = clamp(1 - e.p, 0, 1);

/* ---------------- 처치 연출 ---------------- */

  const kind = killKind(s);

  if (kind === 'orbital') G.fx.push(orbitalFx(s.k, e, tx));
  else if (kind === 'eagle') G.fx.push(eagleFx(s.k, e, tx));
  else if (kind === 'weapon' || kind === 'sentry') G.fx.push(weaponFx(s.k, e, tx));
  else if (kind === 'vehicle') G.fx.push(vehicleFx(s.k, e, tx));

// 투척한 스트라타젬 공(비컨)

}

function orbitalFx(k, e, tx) {

        if (mode === 'single') boom(sh.x, GROUND - 5, 20);
        else if (mode === 'rail') { boom(sh.x, GROUND - 5, 16); flash(0.7, '#bed2ff'); }
        else if (mode === 'barrage') { if (k === 'o-napalm') { boom(sh.x, GROUND - 3, 8); flames(sh.x, GROUND - 1, 10, 1.2); } else boom(sh.x, GROUND - 4, big); }
        else if (mode === 'airburst') { boom(sh.x, GROUND - 40, 9, { noSmoke: true }); for (let i = 0; i < 20; i++) P({ x: sh.x, y: GROUND - 40, vx: rand(-90, 90), vy: rand(40, 160), kind: 'tracer', max: 0.4, col: '#ffd630' }); }

function stepProj(p, dt) {
  if (p.hit) return;
  if (p.at > 0) { p.at -= dt; return; }

  const k = clamp(p.t / p.dur, 0, 1);
  if (p.path === 'silo') {                 // 수직 발사 → 화면 밖 → 목표 위에서 낙하

    else { const q = (k - 0.55) / 0.45; p.x = p.x1; p.y = -30 + q * (p.y1 + 30); p.down = true; }
  } else {
    p.x = p.x0 + (p.x1 - p.x0) * k;
    p.y = p.y0 + (p.y1 - p.y0) * k - Math.sin(k * Math.PI) * p.arc;

  if (p.trail === 'smoke' && Math.random() < 0.8) P({ x: p.x, y: p.y, kind: 'smoke', max: 0.55, r: 1.3 });

  else if (a === 'grenade') { rect(gx, gy - 1, 7, 4, D); rect(gx + 7, gy, 6, 2, D); rect(gx + 1, gy - 1, 5, 1, M); }
  else if (a === 'beam' || a === 'rail' || a === 'quasar' || a === 'nova' || a === 'plasma') { rect(gx, gy - 1, 14, 3, D); rect(gx, gy - 1, 14, 1, L); rect(gx + 13, gy, 2, 1, a === 'beam' || a === 'nova' ? '#ff8c1e' : '#7fe3ff'); rect(gx + 3, gy + 2, 2, 2, D); }
  else if (a === 'melta') { rect(gx, gy - 1, 9, 3, D); rect(gx + 9, gy - 2, 4, 5, M); rect(gx + 13, gy - 1, 1, 3, '#ff8c1e'); }
  else if (a === 'flame' || a === 'gas') { rect(gx - 2, gy - 4, 4, 6, a === 'gas' ? '#4a6a2a' : '#7a1a1a'); rect(gx, gy, 12, 2, D); if (((t * 14) | 0) % 2) rect(gx + 12, gy, 1, 1, a === 'gas' ? '#b4e66e' : '#ff8c1e'); }
  else if (a === 'arc') { rect(gx, gy - 1, 11, 3, D); for (let i = 0; i < 3; i++) rect(gx + 4 + i * 2, gy - 2, 1, 1, '#bed2ff'); rect(gx + 11, gy, 2, 1, '#bed2ff'); }
  else if (a === 'harpoon') { rect(gx, gy, 10, 2, D); rect(gx + 10, gy, 5, 1, '#c4ccd6'); }
  else if (a === 'melee') { rect(gx, gy, 9, 1, '#5a4030'); rect(gx + 8, gy - 3, 4, 7, M); rect(gx + 8, gy - 3, 4, 1, L); }
  else if (a === 'saw') { rect(gx, gy - 1, 5, 3, '#ffd630'); rect(gx + 5, gy, 10, 2, L); if (((t * 30) | 0) % 2) rect(gx + 6, gy + 2, 9, 1, M); }
  else if (a === 'remote') { rect(gx + 2, gy - 3, 3, 4, D); rect(gx + 3, gy - 3, 1, 1, ((t * 8) | 0) % 2 ? '#ff2424' : '#5a1010'); }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 역경직: 잠깐 세상이 멈춤 (흔들림·번쩍임은 계속)
  if (hitstop > 0) hitstop -= dt;
  else { G.time += dt; update(dt); }
  trauma = Math.max(0, trauma - dt * 2.2);
  const kd = Math.exp(-dt * 14); kickX *= kd; kickY *= kd;
  flashA = Math.max(0, flashA - dt * 5);
  camStep(dt);
  render();
  requestAnimationFrame(frame);
}
function decayHit(e, dt) {
  if (e.flash > 0) e.flash -= dt;
  if (e.stun > 0) e.stun -= dt;
  if (e.kx > 0) e.kx = Math.max(0, e.kx - dt * 30);
}
function update(dt) {
  if (G.state === 'play' && G.enemy && !G.enemy.frozen && !G.enemy.stop) {
    updateEnemy(G.enemy, dt);
    if (G.enemy.p >= 1) gameOver();
  }
  for (let i = G.fx.length - 1; i >= 0; i--) if (!G.fx[i].update(dt)) G.fx.splice(i, 1);
  for (let i = G.targets.length - 1; i >= 0; i--) if (G.targets[i].dead) G.targets.splice(i, 1);
  for (const e of G.targets) decayHit(e, dt);
  if (G.enemy) decayHit(G.enemy, dt);
  updateParts(dt);
  for (const s of scorch) s.life += dt;
  if (G.throwT > 0) G.throwT -= dt;
  if (G.raise > 0) G.raise -= dt;
  if (G.recoil > 0) G.recoil = Math.max(0, G.recoil - dt * 18);
  if (G.badFlash > 0) { G.badFlash -= dt; if (G.badFlash <= 0) { lastHud = ''; hud(); } }
  if (G.state === 'play' && !G.enemy && G.idx < G.list.length) {
    if (G.targets.length === 0) { G.viewT += dt; if (G.viewT >= (G.viewBig ? 1.0 : 0.6)) { spawnEnemy(); camReset(); lastHud = ''; hud(); } }
  } else if (G.state === 'play' && !G.enemy && G.fx.length === 0 && G.targets.length === 0) roundClear();
}
function render() {
  const amp = trauma * trauma;
  const sx = Math.round(rand(-1, 1) * 10 * amp + kickX), sy = Math.round(rand(-1, 1) * 7 * amp + kickY);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, '#07080d');
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  if (!bgCanvas) bgCanvas = makeBg(G.faction);
  ctx.drawImage(bgCanvas, 0, 0);
  if (sy < 0) { ctx.fillStyle = '#181210'; ctx.fillRect(0, H, W, -sy + 1); }
  for (const s of scorch) { ctx.globalAlpha = clamp(1 - s.life / 12, 0, 1) * 0.8; circ(s.x, GROUND + 2, s.r, '#181210', 0.28); ctx.globalAlpha = 1; }
  drawParts(0);
  for (const f of G.fx) f.draw();
  drawLouis(G.time);
  for (const e of G.targets) drawEnemy(e, G.time);
  if (G.enemy && G.state !== 'title') drawEnemy(G.enemy, G.time);
  drawParts(1);
  drawParts(2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.enemy && G.state === 'play') {
    const d = clamp(G.enemy.p, 0, 1);
    if (d > 0.72) { ctx.globalAlpha = (d - 0.72) / 0.28 * (0.35 + 0.15 * Math.sin(G.time * 18)); rect(0, 0, 6, H, '#ff2424'); rect(0, 0, W, 3, '#ff2424'); rect(0, H - 3, W, 3, '#ff2424'); ctx.globalAlpha = 1; }
  }
  if (G.badFlash > 0) { ctx.globalAlpha = G.badFlash * 0.5; rect(0, 0, W, H, '#ff2424'); ctx.globalAlpha = 1; }
  if (flashA > 0) { ctx.globalAlpha = Math.min(0.8, flashA); rect(0, 0, W, H, flashC); ctx.globalAlpha = 1; }
}

/* ---------------- 라운드·게임 끝 ---------------- */
function roundClear() {
  camReset();
  G.state = 'clear'; G.clearAt = performance.now();
  const rb = 75 + 25 * G.round, pb = G.perfect ? 100 : 0;
  G.score += rb + pb;
  G.bonus = { rb, pb };
  hud(); overlay();
  setTimeout(() => { if (G.state === 'clear' && performance.now() - G.clearAt > 2900) nextRound(); }, 3000);
}
function gameOver() {
  G.state = 'dying'; G.dead = true; G.enemy.stop = true; G.fx.push(attackFx(G.enemy)); camFocus(PX - 10, ecx(G.enemy), 1.5); sfx.die(); stopFor(0.28, true); addShake(0.9, -4, 0); flash(0.6, '#ff4040');
  sparks(PX, GROUND - 12, 18, ['#ff2424', '#8a1e12']);
  setTimeout(() => {
    G.state = 'over'; G.overAt = performance.now(); camReset();
    if (G.score > G.best) { G.best = G.score; try { localStorage.setItem('setac-hero-best', String(G.best)); } catch (e) {} }
    hud(); overlay();
    try { window.dispatchEvent(new CustomEvent('hero-over', { detail: { score: G.score, round: G.round, kills: G.kills } })); } catch (e) {}
  }, 1100);
  hud();
}

/* ---------------- HUD (글자는 화면 위 판에) ---------------- */
const $ = id => document.getElementById(id);
function iconStyle(s, size) {
  const col = s.i % 10, row = (s.i / 10) | 0;
  return `background-position:${-col * size}px ${-row * size}px;background-size:${size * 10}px auto;width:${size}px;height:${size}px`;
}
let lastHud = '';
function hud() {
  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 3;
  $('rd').textContent = G.state === 'title' ? '' : `ROUND ${G.round}`;
  $('sc').textContent = G.state === 'title' ? `BEST ${G.best.toLocaleString()}` : `${G.score.toLocaleString()}`;
  const cur = $('cur'), ar = $('ar'), nx = $('nx');
  if (G.state !== 'play' || G.idx >= G.list.length) { cur.innerHTML = ''; ar.innerHTML = ''; nx.innerHTML = ''; return; }
  const s = STRATS[G.list[G.idx]];
  const wait = !G.enemy;
  const key = `${G.idx}|${G.prog}|${G.badFlash > 0}|${u}|${wait}`;
  if (key === lastHud) return; lastHud = key;
  const isz = Math.round(13 * u);
  cur.innerHTML = `<i class="ic" style="${iconStyle(s, isz)}"></i><b>${s.n}</b>`;
  let h = '';
  for (let k = 0; k < s.c.length; k++) {
    const d = s.c[k].toLowerCase();
    const st = G.badFlash > 0 ? '2' : (k < G.prog ? '1' : '0');
    h += `<img src="${ARROWS[d + st]}" alt="">`;
  }
  ar.innerHTML = h;

  let n = '';
  const nsz = Math.round(8 * u);
  for (let k = G.idx + 1; k < Math.min(G.idx + 6, G.list.length); k++) n += `<i class="ic" style="${iconStyle(STRATS[G.list[k]], nsz)}"></i>`;
  nx.innerHTML = n;
}

function overlay() {
  const o = $('ov');
  if (G.state === 'title') {
    o.className = 'show';
    o.innerHTML = `<div class="ttl">STRATAGEM<br><span>HERO</span></div><p>코드를 끝까지 맞혀야 스트라타젬이 내려와요.<br>적이 루이스에게 닿기 전에 처리하세요.</p><p class="keys">W A S D · 방향키</p><p class="go">화면을 한 번 누르고, 방향키로 강하 시작</p>`;
  } else if (G.state === 'clear') {
    o.className = 'show';
    o.innerHTML = `<div class="ttl small">ROUND ${G.round} CLEAR</div><p>라운드 보너스 <b>+${G.bonus.rb}</b><br>무실수 보너스 <b>+${G.bonus.pb}</b></p><p class="big">${G.score.toLocaleString()}점</p><p class="go">방향키를 누르면 다음 라운드</p>`;
  } else if (G.state === 'over') {
    o.className = 'show';
    const code = recordCode(G.score, G.round, G.kills);
    o.innerHTML = `<div class="ttl small red">전사</div><p>라운드 ${G.round} · 처치 ${G.kills} · 실수 ${G.miss}</p><p class="big">${G.score.toLocaleString()}점</p><p>최고 기록 ${G.best.toLocaleString()}점</p>`
      + `<div class="rec"><span>기록 코드</span><b class="code">${code}</b><button type="button" class="cp">복사</button></div>`
      + `<p class="hint">순위표에 올리려면 오락기 채널의 <b>🏆 기록 올리기</b>에 이 코드를 넣으세요.</p><p class="go">방향키를 누르면 다시 강하</p>`;
    const cp = o.querySelector('.cp');
    cp.addEventListener('pointerdown', ev => { ev.stopPropagation(); copyCode(code, cp); });
  } else { o.className = ''; o.innerHTML = ''; }
}

/* ---------------- 기록 코드 (디스코드 오락기에 넣으면 순위표에 올라감) ---------------- */
const CODE_SECRET = 'SES-LIBERTY-WINGS-H1';
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function recordCode(score, round, kills) {
  score = Math.min(score, 2097151); round = Math.min(round, 127); kills = Math.min(kills, 255);
  const chk = fnv(`${score}:${round}:${kills}:${CODE_SECRET}`) & 0xfff;
  let v = (BigInt(score) << 27n) | (BigInt(round) << 20n) | (BigInt(kills) << 12n) | BigInt(chk);
  const A = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; let out = '';
  for (let i = 0; i < 10; i++) { out = A[Number(v & 31n)] + out; v >>= 5n; }
  return out.slice(0, 5) + '-' + out.slice(5);
}
function copyCode(code, btn) {
  const done = () => { btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = '복사'; }, 1500); };
  try { navigator.clipboard.writeText(code).then(done, () => selectCode()); } catch (e) { selectCode(); }
}
function selectCode() { const el = document.querySelector('#ov .code'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }

/* ---------------- 입력 ---------------- */
const KEYS = { ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D', ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R' };
window.addEventListener('keydown', ev => {
  const d = KEYS[ev.code];
  if (d) { ev.preventDefault(); if (!ev.repeat) { const before = G.state; press(d); if (before !== G.state) overlay(); } }
  else if ((ev.code === 'Enter' || ev.code === 'Space') && !ev.repeat) { ev.preventDefault(); const before = G.state; if (G.state !== 'play') press('U'); if (before !== G.state) overlay(); }
});
for (const b of document.querySelectorAll('#pad button')) {
  b.addEventListener('pointerdown', ev => { ev.preventDefault(); const before = G.state; press(b.dataset.d); if (before !== G.state) overlay(); });
}
$('ov').addEventListener('pointerdown', ev => { if (ev.target.closest('.rec')) return; window.focus(); if (G.state === 'title') { const before = G.state; press('U'); if (before !== G.state) overlay(); } else if (G.state !== 'play' && !document.body.classList.contains('touch')) { /* 끝난 화면은 방향키로만 넘어감 */ } else if (G.state !== 'play') { const before = G.state; press('U'); if (before !== G.state) overlay(); } });
window.addEventListener('blur', () => { document.body.classList.add('nofocus'); });
window.addEventListener('focus', () => { document.body.classList.remove('nofocus'); });
document.addEventListener('pointerdown', () => { window.focus(); });

/* ---------------- 크기 맞추기 ---------------- */
/* ---------------- 연출 카메라: 코드를 맞히면 화살표를 치우고 루이스~목표 사이로 확대 ---------------- */
let UI_U = 3;
const CAM = { z: 1, x: W / 2, y: H / 2, tz: 1, tx: W / 2, ty: H / 2 };
function camFocus(x0, x1, zmax) {
  const z = clamp(W / (Math.abs(x1 - x0) + 70), 1.15, zmax);
  const hw = W / (2 * z), hh = H / (2 * z);
  CAM.tz = z; CAM.tx = clamp((x0 + x1) / 2, hw, W - hw); CAM.ty = clamp(GROUND + 14 - hh, hh, H - hh);
  document.body.classList.add('cine');
}
function camReset() { CAM.tz = 1; CAM.tx = W / 2; CAM.ty = H / 2; document.body.classList.remove('cine'); }
function camStep(dt) {
  const k = 1 - Math.exp(-dt * 6);
  CAM.z += (CAM.tz - CAM.z) * k; CAM.x += (CAM.tx - CAM.x) * k; CAM.y += (CAM.ty - CAM.y) * k;
  if (Math.abs(CAM.z - 1) < 0.002 && CAM.tz === 1) { CAM.z = 1; CAM.x = W / 2; CAM.y = H / 2; }
  const z = CAM.z, hw = W / (2 * z), hh = H / (2 * z);
  const cx = clamp(CAM.x, hw, W - hw), cy = clamp(CAM.y, hh, H - hh);
  const tx = W * UI_U / 2 - z * cx * UI_U, ty = H * UI_U / 2 - z * cy * UI_U;
  cv.style.transform = z === 1 ? '' : `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${z.toFixed(4)})`;
}

function fit() {
  const touch = matchMedia('(pointer: coarse)').matches;
  document.body.classList.toggle('touch', touch);
  const padH = touch ? Math.min(window.innerHeight * 0.32, 200) : 0;
  const u = Math.max(1, Math.min(window.innerWidth / W, (window.innerHeight - padH) / H));
  document.documentElement.style.setProperty('--u', u.toFixed(3));
  UI_U = u;
  const wrap = $('wrap'); wrap.style.width = (W * u) + 'px'; wrap.style.height = (H * u) + 'px';
  lastHud = ''; hud();
}
window.addEventListener('resize', fit);
fit();
overlay();
requestAnimationFrame(frame);
window.__hero = { G, press, STRATS, recordCode, makeEnemy, EN, spawnEnemy, setFaction: f => { G.faction = f; bgCanvas = makeBg(f); } };

    catch (e) { console.warn('discord sdk', e); }
  }
})();
